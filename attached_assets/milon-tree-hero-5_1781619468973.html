<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILŌN — Financial Health</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #040d0a; font-family: 'DM Sans', sans-serif; color: #e8e0d0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .hero {
    position: relative; width: 420px; max-width: 100vw; aspect-ratio: 9/16; overflow: hidden;
  }
  .tree-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 50%, transparent 40%, rgba(4,13,10,0.35) 100%),
      linear-gradient(to bottom, rgba(4,13,10,0.1) 0%, transparent 30%, transparent 60%, rgba(4,13,10,0.55) 100%);
    z-index: 1; pointer-events: none;
  }

  /* Highlight overlay SVG — zones that glow on click */
  .highlight-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
  }
  /* Invisible clickable hit-areas over each tree region */
  .hit-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 3; /* above visuals, below labels */
    pointer-events: none; /* empty space falls through */
  }
  .hit-area {
    fill: rgba(255,255,255,0.001); /* near-transparent but fillable */
    cursor: pointer;
    pointer-events: all; /* paths themselves catch taps */
  }
  .hit-area:hover { fill: rgba(255,255,255,0.05); }
  .zone {
    opacity: 0; transition: opacity 0.5s ease;
  }
  .zone.active { opacity: 1; }
  .zone-glow {
    fill: none; stroke-width: 3; stroke-linecap: round;
    filter: drop-shadow(0 0 8px currentColor);
  }

  .connectors {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
  }
  .labels { position: absolute; inset: 0; z-index: 4; pointer-events: none; }

  .label {
    position: absolute; display: flex; flex-direction: column; gap: 2px;
    align-items: flex-start;
    opacity: 0; animation: fadeIn 0.6s ease forwards; cursor: pointer;
    pointer-events: auto; transition: transform 0.2s ease;
  }
  .label:hover { transform: scale(1.05); }
  .label:active { transform: scale(0.97); }

  .label-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(4, 13, 10, 0.72);
    border: 1px solid rgba(212, 175, 55, 0.4);
    backdrop-filter: blur(8px); border-radius: 4px; padding: 6px 10px; white-space: nowrap;
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  .label.selected .label-chip {
    border-color: rgba(212,175,55,0.9);
    background: rgba(4,13,10,0.9);
  }
  .label-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; animation: pulse 2.4s ease-in-out infinite; }
  .label-name {
    font-family: 'Cormorant Garamond', serif; font-size: 13px; font-weight: 300;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .label-value { font-size: 12px; font-weight: 500; color: rgba(255,235,170,0.95); letter-spacing: 0.04em; padding-left: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
  .score-bar { height: 4px; background: rgba(0,0,0,0.4); border-radius: 2px; overflow: hidden; margin: 2px 2px 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .score-fill { height: 100%; border-radius: 2px; box-shadow: 0 0 6px currentColor; }

  /* === NEW POSITIONS === */
  /* CASH — top */
  .label-cash { top: 13%; left: 50%; transform: translateX(-50%); animation-delay: 0.2s; }
  .label-cash:hover { transform: translateX(-50%) scale(1.05); }
  /* PROFIT — canopy (upper) */
  .label-profit { top: 26%; right: 4%; animation-delay: 0.45s; }
  /* ASSETS — stem (middle) */
  .label-assets { top: 55%; left: 3%; animation-delay: 0.7s; }
  /* FINANCING — roots (lower) */
  .label-financing { bottom: 18%; right: 4%; animation-delay: 0.95s; }

  .dot-profit { background: #d4af37; box-shadow: 0 0 6px #d4af37; }
  .dot-assets { background: #7ec8a0; box-shadow: 0 0 6px #7ec8a0; }
  .dot-financing { background: #a78bfa; box-shadow: 0 0 6px #a78bfa; }
  .dot-cash { background: #60b8e0; box-shadow: 0 0 6px #60b8e0; }
  .fill-profit { background: #d4af37; color: #d4af37; width: 78%; }
  .fill-assets { background: #7ec8a0; color: #7ec8a0; width: 65%; }
  .fill-financing { background: #a78bfa; color: #a78bfa; width: 52%; }
  .fill-cash { background: #60b8e0; color: #60b8e0; width: 83%; }
  .name-profit { color: #d4af37; }
  .name-assets { color: #7ec8a0; }
  .name-financing { color: #a78bfa; }
  .name-cash { color: #60b8e0; }

  .line { stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.5; }
  .line-profit { stroke: #d4af37; }
  .line-assets { stroke: #7ec8a0; }
  .line-financing { stroke: #a78bfa; }
  .line-cash { stroke: #60b8e0; }

  .hint {
    position: absolute; top: 14px; left: 14px;
    z-index: 5; font-size: 11px; letter-spacing: 0.08em; line-height: 1.4;
    color: rgba(232,224,208,0.85); pointer-events: none; transition: opacity 0.4s ease;
    text-align: left; font-weight: 400;
    background: rgba(4,13,10,0.55); backdrop-filter: blur(6px);
    border-left: 2px solid rgba(212,175,55,0.6);
    padding: 7px 11px; border-radius: 0 4px 4px 0;
    max-width: 145px;
  }
  .hint.hidden { opacity: 0; }

  .brand {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 6;
    padding: 16px 20px 20px;
    background: linear-gradient(to top, rgba(4,13,10,0.92) 0%, transparent 100%);
    display: flex; flex-direction: column; gap: 4px;
    pointer-events: none; /* don't block root taps underneath */
  }
  .brand-name { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: 0.3em; color: #d4af37; }
  .brand-tagline { font-size: 10px; letter-spacing: 0.14em; color: rgba(232,224,208,0.5); text-transform: uppercase; }


  /* View-ratios affordance — appears only on selected chip */
  .drill-prompt {
    display: none; align-items: center; gap: 5px;
    margin: 6px 0 0; padding: 6px 12px;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
    color: #f0e8d4;
    background: rgba(6,16,12,0.92);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 4px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    white-space: nowrap; width: fit-content;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .label.selected .drill-prompt { display: inline-flex; animation: fadeIn 0.4s ease; }
  .drill-prompt:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
  .drill-arrow { transition: transform 0.2s ease; }
  .drill-prompt:hover .drill-arrow { transform: translateX(2px); }

  /* Slide-up drill-down panel */
  .drill-panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(6,16,12,0.97); backdrop-filter: blur(16px);
    border-top: 1px solid rgba(212,175,55,0.25);
    border-radius: 16px 16px 0 0;
    padding: 18px 20px 24px;
    transform: translateY(100%); transition: transform 0.38s cubic-bezier(0.22,1,0.36,1);
    max-height: 72%; overflow-y: auto;
  }
  .drill-panel.open { transform: translateY(0); }
  .drill-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .drill-title {
    font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 300;
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .drill-total { font-size: 11px; color: rgba(232,224,208,0.55); letter-spacing: 0.08em; margin-bottom: 16px; }
  .drill-close {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: transparent; color: rgba(232,224,208,0.8); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .drill-close:hover { background: rgba(255,255,255,0.08); }

  .ratio-row {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .ratio-row:last-child { border-bottom: none; }
  .ratio-name { font-size: 13px; color: #e8e0d0; font-weight: 400; }
  .ratio-score { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  .ratio-trend { font-size: 13px; min-width: 18px; text-align: center; }
  .trend-up { color: #7ec8a0; }
  .trend-down { color: #e8857a; }
  .trend-flat { color: rgba(232,224,208,0.4); }

  .drill-backdrop {
    position: absolute; inset: 0; z-index: 9; background: rgba(0,0,0,0); 
    pointer-events: none; transition: background 0.3s ease;
  }
  .drill-backdrop.open { background: rgba(0,0,0,0.45); pointer-events: auto; }


  /* Ambient gold motes — faint, slow, behind the tree */
  .motes {
    position: absolute; inset: 0; z-index: 1; /* above img, below highlights(2) */
    pointer-events: none; overflow: hidden;
  }
  .mote {
    position: absolute; border-radius: 50%;
    background: rgba(255,223,130,1);
    box-shadow: 0 0 4px 1px rgba(255,210,90,0.8), 0 0 8px 2px rgba(212,175,55,0.4);
    opacity: 0; will-change: transform, opacity;
    animation: drift linear infinite;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(8px) translateX(0); }
    15%  { opacity: var(--peak); }
    85%  { opacity: var(--peak); }
    100% { opacity: 0; transform: translateY(-26px) translateX(var(--sway)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mote { animation: none; opacity: 0.12; }
  }


  /* Composite Business Health Score — hero anchor, top-center */
  .health {
    position: absolute; top: 14px; right: 14px;
    z-index: 5; text-align: right; pointer-events: none;
    background: rgba(6,16,12,0.78); backdrop-filter: blur(8px);
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 8px; padding: 8px 12px 10px;
    opacity: 0; animation: fadeIn 0.9s ease 0.1s forwards;
  }
  .health-eyebrow {
    font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(232,224,208,0.6); margin-bottom: -1px;
  }
  .health-score {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: 40px; line-height: 0.95; letter-spacing: 0.01em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  .health-score-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; }
  .health-outof { font-size: 11px; color: rgba(232,224,208,0.5); font-family: 'DM Sans', sans-serif; }
  .health-track {
    width: 90px; height: 3px; margin: 6px 0 0 auto;
    background: rgba(0,0,0,0.45); border-radius: 2px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .health-fill { height: 100%; border-radius: 2px; transition: width 1s ease; box-shadow: 0 0 8px currentColor; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }
</style>
</head>

      <div class="label-chip"><span class="label-dot dot-profit"></span><span class="label-name name-profit">Profit</span></div>
      <div class="label-value">78 / 100</div>
      <div class="score-bar"><div class="score-fill fill-profit"></div></div>
      <div class="drill-prompt" data-drill="profit">View ratios <span class="drill-arrow">→</span></div>
    </div>
    <div class="label label-assets" data-zone="zone-stem">
      <div class="label-chip"><span class="label-dot dot-assets"></span><span class="label-name name-assets">Assets</span></div>
      <div class="label-value">65 / 100</div>
      <div class="score-bar"><div class="score-fill fill-assets"></div></div>
      <div class="drill-prompt" data-drill="assets">View ratios <span class="drill-arrow">→</span></div>
    </div>
    <div class="label label-financing" data-zone="zone-roots">
      <div class="label-chip"><span class="label-dot dot-financing"></span><span class="label-name name-financing">Financing</span></div>
      <div class="label-value">52 / 100</div>
      <div class="score-bar"><div class="score-fill fill-financing"></div></div>
      <div class="drill-prompt" data-drill="financing">View ratios <span class="drill-arrow">→</span></div>
    </div>
  </div>

  <div class="hint" id="hint">Tap a label or part<br>of the tree to explore</div>

  <!-- DRILL-DOWN BACKDROP + PANEL -->
  <div class="drill-backdrop" id="drillBackdrop"></div>
  <div class="drill-panel" id="drillPanel">
    <div class="drill-header">
      <div class="drill-title" id="drillTitle">Cash</div>
      <button class="drill-close" id="drillClose">✕</button>
    </div>
    <div class="drill-total" id="drillTotal">Composite health score 83 / 100</div>
    <div id="drillBody"></div>
  </div>

  <div class="brand">
    <div class="brand-name">MILŌN</div>
    <div class="brand-tagline">Business Health Intelligence</div>
  </div>
</div>

<script>
  const labels = document.querySelectorAll('.label');
  const zones = document.querySelectorAll('.zone');
  const hits = document.querySelectorAll('.hit-area');
  const hint = document.getElementById('hint');

  function selectPillar(labelEl) {
    const zoneId = labelEl.dataset.zone;
    const isAlreadySelected = labelEl.classList.contains('selected');

    labels.forEach(l => l.classList.remove('selected'));
    zones.forEach(z => z.classList.remove('active'));

    if (!isAlreadySelected) {
      labelEl.classList.add('selected');
      document.getElementById(zoneId).classList.add('active');
      hint.classList.add('hidden');
    } else {
      hint.classList.remove('hidden');
    }
  }

  // Forward: click a label
  labels.forEach(label => {
    label.addEventListener('click', () => selectPillar(label));
  });

  // Reverse: click a tree region
  hits.forEach(hit => {
    hit.addEventListener('click', () => {
      const labelEl = document.querySelector('.' + hit.dataset.pillar);
      if (labelEl) selectPillar(labelEl);
    });
  });

  // === DRILL-DOWN: ratios feeding each pillar score ===
  // Real SA-relevant ratio names, placeholder scores/trends — wire to Supabase later.
  const RATIOS = {
    cash: { title: 'Cash', total: 83, color: '#60b8e0', rows: [
      { name: 'Current Ratio', score: 88, trend: 'up' },
      { name: 'Quick Ratio (Acid Test)', score: 79, trend: 'up' },
      { name: 'Cash Runway (months)', score: 85, trend: 'flat' },
      { name: 'Operating Cash Flow Ratio', score: 81, trend: 'up' },
      { name: 'Cash Conversion Cycle', score: 76, trend: 'down' },
    ]},
    profit: { title: 'Profit', total: 78, color: '#d4af37', rows: [
      { name: 'Gross Profit Margin', score: 82, trend: 'up' },
      { name: 'Net Profit Margin', score: 74, trend: 'flat' },
      { name: 'Operating Margin', score: 77, trend: 'up' },
      { name: 'Return on Equity (ROE)', score: 80, trend: 'up' },
      { name: 'EBITDA Margin', score: 76, trend: 'down' },
    ]},
    assets: { title: 'Assets', total: 65, color: '#7ec8a0', rows: [
      { name: 'Asset Turnover', score: 68, trend: 'flat' },
      { name: 'Inventory Turnover', score: 61, trend: 'down' },
      { name: 'Debtor Days (DSO)', score: 59, trend: 'down' },
      { name: 'Return on Assets (ROA)', score: 70, trend: 'up' },
      { name: 'Fixed Asset Turnover', score: 67, trend: 'flat' },
    ]},
    financing: { title: 'Financing', total: 52, color: '#a78bfa', rows: [
      { name: 'Debt-to-Equity', score: 48, trend: 'down' },
      { name: 'Interest Cover', score: 55, trend: 'flat' },
      { name: 'Gearing Ratio', score: 50, trend: 'down' },
      { name: 'Debt Service Coverage', score: 54, trend: 'up' },
      { name: 'Equity Ratio', score: 53, trend: 'flat' },
    ]},
  };

  const panel = document.getElementById('drillPanel');
  const backdrop = document.getElementById('drillBackdrop');
  const drillTitle = document.getElementById('drillTitle');
  const drillTotal = document.getElementById('drillTotal');
  const drillBody = document.getElementById('drillBody');

  const trendGlyph = { up: '↑', down: '↓', flat: '→' };
  const trendClass = { up: 'trend-up', down: 'trend-down', flat: 'trend-flat' };

  function openDrill(pillar) {
    const data = RATIOS[pillar];
    if (!data) return;
    drillTitle.textContent = data.title;
    drillTitle.style.color = data.color;
    drillTotal.textContent = 'Composite health score ' + data.total + ' / 100';
    drillBody.innerHTML = data.rows.map(r => `
      <div class="ratio-row">
        <span class="ratio-name">${r.name}</span>
        <span class="ratio-score" style="color:${data.color}">${r.score}</span>
        <span class="ratio-trend ${trendClass[r.trend]}">${trendGlyph[r.trend]}</span>
      </div>`).join('');
    panel.classList.add('open');
    backdrop.classList.add('open');
  }
  function closeDrill() {
    panel.classList.remove('open');
    backdrop.classList.remove('open');
  }

  document.querySelectorAll('.drill-prompt').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();           // don't bubble to label (would toggle selection)
      openDrill(btn.dataset.drill);
    });
  });
  document.getElementById('drillClose').addEventListener('click', closeDrill);
  backdrop.addEventListener('click', closeDrill);

  // === Ambient gold motes — spawned in negative space, kept faint ===
  (function(){
    const layer = document.getElementById('motes');
    if (!layer) return;
    const COUNT = 30;
    for (let i=0;i<COUNT;i++){
      const m = document.createElement('div');
      m.className = 'mote';
      // Keep motes in the empty teal: left/right edge bands + upper sky only.
      let x, y;
      const r = Math.random();
      if (r < 0.45)      { x = Math.random()*24; y = Math.random()*100; }        // left band
      else if (r < 0.90) { x = 76 + Math.random()*24; y = Math.random()*100; }   // right band
      else               { x = 24 + Math.random()*52; y = Math.random()*22; }    // upper sky strip
      const size = 1.8 + Math.random()*2.4;        // 1.8-4.2px
      const peak = 0.45 + Math.random()*0.4;       // 0.45-0.85, visible but soft
      const dur = 13 + Math.random()*12;           // 13-25s, slow
      const delay = -Math.random()*dur;            // desync
      const sway = (Math.random()*16 - 8) + 'px';

      m.style.left = x + '%';
      m.style.top = y + '%';
      m.style.width = size + 'px';
      m.style.height = size + 'px';
      m.style.setProperty('--peak', peak);
      m.style.setProperty('--sway', sway);
      m.style.animationDuration = dur + 's';
      m.style.animationDelay = delay + 's';
      layer.appendChild(m);
    }
  })();


  // === Composite health score — computed from the four pillar totals ===
  (function(){
    const pillars = ['cash','profit','assets','financing'];
    const totals = pillars.map(p => RATIOS[p].total);
    const composite = Math.round(totals.reduce((a,b)=>a+b,0) / totals.length);

    // status colour: >=75 healthy gold-green, 60-74 amber, <60 risk
    let color;
    if (composite >= 75) color = '#7ec8a0';
    else if (composite >= 60) color = '#d4af37';
    else color = '#e0a85a';

    const scoreEl = document.getElementById('healthScore');
    const fillEl  = document.getElementById('healthFill');
    scoreEl.textContent = composite;
    scoreEl.style.color = color;
    fillEl.style.background = color;
    fillEl.style.color = color;
    // animate fill after paint
    requestAnimationFrame(()=>{ setTimeout(()=>{ fillEl.style.width = composite + '%'; }, 200); });
  })();

</script>

</body>
</html>
