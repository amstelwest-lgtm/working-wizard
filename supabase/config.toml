project_id = "jxclnsbsqpixxqlbcapl"

# Owner sign-up goes straight to the board; the address is verified later via a
# soft "Send verification link" banner on /app (magic link → /auth/verified).
# Hosted projects: mirror this in Dashboard → Authentication → Sign In / Providers
# → Email → "Confirm email" OFF, and add <site>/auth/verified to Redirect URLs.
[auth.email]
enable_confirmations = false

# Branded auth emails. Hosted projects do not read these from the repo.
# Dashboard → Authentication → Email Templates → Magic Link:
# subject "Sign in to Milōn", body = magic_link.html.
# Owners and accountants share that sign-in mail. Do not paste verify.html
# into the Magic Link slot — that file is the board's "verify later" copy.
[auth.email.template.magic_link]
subject = "Sign in to Milōn"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.verify]
subject = "Verify your Milōn email"
content_path = "./supabase/templates/verify.html"

[auth.email.template.recovery]
subject = "Reset your Milōn password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your Milōn account"
content_path = "./supabase/templates/confirmation.html"

# Public no-login task links — GET/POST are authorised by the token itself.
[functions.task-link]
verify_jwt = false

# Admin endpoint — requires a logged-in app user (JWT verified).
[functions.task-admin]
verify_jwt = true

# Client Brain propose — accountant JWT; writes proposed_next_steps + draft stubs.
[functions.brain-propose]
verify_jwt = true

# Client Brain deliverable draft — accountant JWT; writes deliverable_drafts as draft only.
[functions.brain-deliverable-draft]
verify_jwt = true

# In-app Milōn bot — JWT; worker bee on the current client brain. Same Anthropic secret as ask-ai.
[functions.milon-bot]
verify_jwt = true

# Background analyst. Service-role JWT. Does not serve the in-app chat.
[functions.agent-analyst]
verify_jwt = true

# Background financial manager. Service-role JWT. Drafts only.
[functions.agent-financial-manager]
verify_jwt = true

# Background advisor. Service-role JWT. Drafts only. Does not sign off.
[functions.agent-advisor]
verify_jwt = true

# Owner action hand-off. Caller JWT. Service role writes the queued run.
[functions.owner-handoff]
verify_jwt = true

# Approve or dismiss one agent draft. Caller JWT. Service role writes the live row.
[functions.agent-draft-decision]
verify_jwt = true

# Cron dispatcher. Service-role JWT. The schedule is inserted inactive.
[functions.agent-dispatch]
verify_jwt = true

# Source document extraction. Caller JWT. Writes a proposal only. Does not post.
[functions.extract-source-document]
verify_jwt = true

# Public one-agent sample. No user JWT. The function checks its own limits
# and writes leads with the service role.
[functions.prospect-talk]
verify_jwt = false
