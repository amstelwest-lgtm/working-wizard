<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Milōn</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #ffffff;
        --ink: #102a43;
        --cobalt: #0b5fff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--canvas);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        display: block;
        margin: 0 auto 16px;
      }
      .wordmark {
        width: min(240px, 70%);
        height: auto;
        display: block;
        margin: 0 auto 20px;
      }
      p {
        margin: 0 0 24px;
        font-size: 16px;
        line-height: 1.45;
        color: var(--ink);
      }
      button {
        appearance: none;
        border: 0;
        background: var(--cobalt);
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 12px 22px;
        border-radius: 999px;
      }
      button:active { background: #0847c2; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="mark.png" alt="" width="88" height="88" />
      <img class="wordmark" src="wordmark.png" alt="MILŌN" />
      <p id="message">Milōn could not open this page. Check the connection and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace("https://www.milonfinance.com");
      });
    </script>
  </body>
</html>
