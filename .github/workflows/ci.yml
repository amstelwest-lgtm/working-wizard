name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: the exact production build. A .client/.server import-protection
  # violation or a broken chunk shows up here, not on the Vercel deploy.
  build:
    name: Production build (Vercel target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:vercel
      - name: US-reachable assets must not contain SA pricing copy
        run: node scripts/za-bundle-leak.mjs
      - name: Client bundle must not contain the Node Sentry SDK
        run: |
          if grep -rl "@sentry/node\|@opentelemetry" dist/client >/dev/null 2>&1; then
            echo "::error::Server-only monitoring code leaked into the client bundle"; exit 1
          fi
      - name: Production /clients/:id chunk has no initialization crash
        run: node scripts/client-route-build-render.mjs

  side-parity:
    name: owner/accountant parity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Both sides of a mapped pair move together
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/side-parity.mjs

  # Blocking: ask-ai, milon-bot, brain-propose, and brain-deliverable-draft
  # prod are one-liners that import these entries from raw.githubusercontent.com
  # at a pinned commit. That runtime resolves the graph with Deno defaults —
  # explicit extensions, no import map, no sloppy imports, and no repo
  # deno.lock — so this job uses the same rules. A bare `@/` or an
  # extensionless relative import fails here, the same way the redeploy would.
  # --no-lock keeps the root deno.lock from pinning esm.sh.
  ask-ai-deno:
    name: ask-ai Deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - name: deno check ask-ai
        run: deno check --no-lock supabase/functions/ask-ai/index.ts
      - name: deno check milon-bot
        run: deno check --no-lock supabase/functions/milon-bot/index.ts
      - name: deno check brain-propose
        run: deno check --no-lock supabase/functions/brain-propose/index.ts
      - name: deno check brain-deliverable-draft
        run: deno check --no-lock supabase/functions/brain-deliverable-draft/index.ts
      - name: deno check agent-analyst
        run: deno check --no-lock supabase/functions/agent-analyst/index.ts
      - name: deno check agent-financial-manager
        run: deno check --no-lock supabase/functions/agent-financial-manager/index.ts
      - name: deno check agent-advisor
        run: deno check --no-lock supabase/functions/agent-advisor/index.ts
      - name: deno check agent-dispatch
        run: deno check --no-lock supabase/functions/agent-dispatch/index.ts
      - name: deno check owner-handoff
        run: deno check --no-lock supabase/functions/owner-handoff/index.ts
      - name: deno check agent-draft-decision
        run: deno check --no-lock supabase/functions/agent-draft-decision/index.ts
      - name: deno check extract-source-document
        run: deno check --no-lock supabase/functions/extract-source-document/index.ts
      - name: deno check prospect-talk
        run: deno check --no-lock supabase/functions/prospect-talk/index.ts

  # Blocking: every test:* script that runs without a database.
  tests:
    name: Unit and source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci

  # Blocking: clients RLS initplan check, then the source-document migration on a
  # fresh database. Postgres
  # checks SQL function bodies at CREATE time, so a function that names a table
  # created later in the same file fails here. The older migration files are
  # not replayed; 20260522100000 references clients.accountant_id, which the
  # files before it never create.
  sql-migrations:
    name: Source-document SQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and SQL tests
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          bash scripts/clients-rls-initplan-check.sh
          bash scripts/apply-source-documents-sql.sh
          bash scripts/apply-client-agent-sends-sql.sh
          bash scripts/apply-client-agent-send-storage-sql.sh

  # Reporting for the existing typing and Prettier backlog, except undefined
  # names. `tsc` still carries long-standing PostgREST / vite-plugin errors, and
  # `eslint .` a Prettier backlog, so those stay non-blocking. TS2304 / TS2552
  # (Cannot find name) fail the job — a missing const is a runtime ReferenceError
  # and esbuild will still emit the bundle. Once the rest is clean, turn the
  # remaining `exit 0` into a real failure.
  typecheck-and-lint:
    name: Typecheck + lint (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json > tsc.log 2>&1 || true
          n=$(grep -c "error TS" tsc.log || true)
          undef=$(grep -Ec "error TS(2304|2552):" tsc.log || true)
          echo "### tsc: $n error(s) (baseline 30); undefined names: $undef" >> "$GITHUB_STEP_SUMMARY"
          grep "error TS" tsc.log | sed -E 's/\([0-9]+,[0-9]+\)//' | sort | uniq -c | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$n" -gt 30 ]; then echo "::warning::tsc errors rose to $n (baseline 30) — see step summary"; fi
          if [ "$undef" -gt 0 ]; then
            echo "::error::tsc reported $undef undefined identifier(s) (TS2304/TS2552)"
            grep -E "error TS(2304|2552):" tsc.log
            exit 1
          fi
          exit 0
      - name: eslint (non-formatting rules)
        run: |
          pnpm exec eslint . --quiet --rule 'prettier/prettier: off' -f json > eslint.json 2>/dev/null || true
          n=$(node -e 'const r=require("./eslint.json");console.log(r.reduce((s,f)=>s+f.errorCount,0))')
          echo "### eslint (prettier excluded): $n error(s) (baseline ~60)" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./eslint.json");const by={};for(const f of r)for(const m of f.messages)by[m.ruleId]=(by[m.ruleId]||0)+1;console.log(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`- ${k}: ${v}`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 60 ]; then echo "::warning::eslint errors rose to $n (baseline ~60) — see step summary"; fi
          exit 0
