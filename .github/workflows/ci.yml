name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: the exact production build. A .client/.server import-protection
  # violation or a broken chunk shows up here, not on the Vercel deploy.
  build:
    name: Production build (Vercel target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:vercel
      - name: Client bundle must not contain the Node Sentry SDK
        run: |
          if grep -rl "@sentry/node\|@opentelemetry" dist/client >/dev/null 2>&1; then
            echo "::error::Server-only monitoring code leaked into the client bundle"; exit 1
          fi

  # Blocking: ask-ai and milon-bot prod are one-liners that import these
  # entries from raw.githubusercontent.com at a pinned commit. That runtime
  # resolves the graph with Deno defaults — explicit extensions, no import
  # map, no sloppy imports, and no repo deno.lock — so this job uses the same
  # rules. A bare `@/` or an extensionless relative import fails here, the
  # same way the redeploy would. --no-lock keeps the root deno.lock from
  # pinning esm.sh.
  ask-ai-deno:
    name: ask-ai Deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7
      - name: deno check ask-ai
        run: deno check --no-lock supabase/functions/ask-ai/index.ts
      - name: deno check milon-bot
        run: deno check --no-lock supabase/functions/milon-bot/index.ts

  # Blocking: every test:* script that runs without a database.
  tests:
    name: Unit and source tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ci

  # Reporting for the existing typing and Prettier backlog, except undefined
  # names. `tsc` still carries long-standing PostgREST / vite-plugin errors, and
  # `eslint .` a Prettier backlog, so those stay non-blocking. TS2304 / TS2552
  # (Cannot find name) fail the job — a missing const is a runtime ReferenceError
  # and esbuild will still emit the bundle. Once the rest is clean, turn the
  # remaining `exit 0` into a real failure.
  typecheck-and-lint:
    name: Typecheck + lint (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc
        run: |
          pnpm exec tsc --noEmit -p tsconfig.json > tsc.log 2>&1 || true
          n=$(grep -c "error TS" tsc.log || true)
          undef=$(grep -Ec "error TS(2304|2552):" tsc.log || true)
          echo "### tsc: $n error(s) (baseline 30); undefined names: $undef" >> "$GITHUB_STEP_SUMMARY"
          grep "error TS" tsc.log | sed -E 's/\([0-9]+,[0-9]+\)//' | sort | uniq -c | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$n" -gt 30 ]; then echo "::warning::tsc errors rose to $n (baseline 30) — see step summary"; fi
          if [ "$undef" -gt 0 ]; then
            echo "::error::tsc reported $undef undefined identifier(s) (TS2304/TS2552)"
            grep -E "error TS(2304|2552):" tsc.log
            exit 1
          fi
          exit 0
      - name: eslint (non-formatting rules)
        run: |
          pnpm exec eslint . --quiet --rule 'prettier/prettier: off' -f json > eslint.json 2>/dev/null || true
          n=$(node -e 'const r=require("./eslint.json");console.log(r.reduce((s,f)=>s+f.errorCount,0))')
          echo "### eslint (prettier excluded): $n error(s) (baseline ~60)" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require("./eslint.json");const by={};for(const f of r)for(const m of f.messages)by[m.ruleId]=(by[m.ruleId]||0)+1;console.log(Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`- ${k}: ${v}`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 60 ]; then echo "::warning::eslint errors rose to $n (baseline ~60) — see step summary"; fi
          exit 0
